[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediride-common"
version = "0.1.0"
description = "MediRide shared library for microservices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aio-pika>=9.4.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["mediride_common*"]
