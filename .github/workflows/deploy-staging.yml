name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to staging.getmedigo.com
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR=/opt/mediride
            COMPOSE_FILE=deploy/docker-compose.staging.yml
            DC="docker compose --env-file .env -f $COMPOSE_FILE"

            echo "=== Deploying MediRide to staging ==="

            # --- Ensure dependencies are installed ---
            if ! command -v git &>/dev/null; then
              echo "Installing git..."
              sudo dnf install -y git
            fi

            # Install Docker CE from official repo (Amazon Linux's docker package is too old)
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker CE..."
              sudo dnf install -y dnf-plugins-core
              sudo dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              sudo dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ec2-user
              echo "Docker installed. Re-run this workflow for group permissions to take effect."
              exit 0
            fi

            # --- Clone or pull code ---
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First-time setup: cloning repository..."
              sudo mkdir -p /opt/mediride
              sudo chown ec2-user:ec2-user /opt/mediride
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git $APP_DIR
            else
              echo "Pulling latest changes..."
              cd $APP_DIR
              git fetch origin main
              git reset --hard origin/main
            fi

            cd $APP_DIR

            # --- Verify .env exists ---
            if [ ! -f ".env" ]; then
              echo "ERROR: .env file missing at $APP_DIR/.env"
              echo "SSH into the server and create it first:"
              echo "  cp deploy/env.staging.example .env"
              echo "  nano .env  # fill in real values"
              exit 1
            fi

            # --- Build and deploy ---
            echo "Building services..."
            $DC build

            echo "Starting services..."
            $DC up -d

            # --- Wait for infrastructure ---
            echo "Waiting for infrastructure to be healthy..."
            sleep 25

            # --- Run migrations ---
            echo "Running migrations..."
            $DC exec -T auth-service alembic upgrade head || echo "auth-service migration skipped"
            $DC exec -T user-service alembic upgrade head || echo "user-service migration skipped"
            $DC exec -T ride-service alembic upgrade head || echo "ride-service migration skipped"
            $DC exec -T location-service alembic upgrade head || echo "location-service migration skipped"
            $DC exec -T payment-service alembic upgrade head || echo "payment-service migration skipped"
            $DC exec -T tracking-service alembic upgrade head || echo "tracking-service migration skipped"
            $DC exec -T notification-service alembic upgrade head || echo "notification-service migration skipped"

            # --- Health check ---
            echo "Running health checks..."
            sleep 5
            HEALTH=$(curl -sf http://localhost:8080/health/live || echo "FAILED")
            echo "API Gateway health: $HEALTH"

            # --- Cleanup ---
            echo "Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "=== Deployment complete! ==="
            echo "Staging URL: https://staging.getmedigo.com"
