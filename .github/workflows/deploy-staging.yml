name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to staging.getmedigo.com
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR=/opt/mediride
            COMPOSE_FILE=deploy/docker-compose.staging.yml
            DC="docker compose --env-file .env -f $COMPOSE_FILE"

            echo "=== Deploying MediRide to staging ==="

            # --- Ensure dependencies are installed ---
            if ! command -v git &>/dev/null; then
              echo "Installing git..."
              sudo dnf install -y git
            fi

            # Install Docker + buildx + compose on Amazon Linux 2023
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker..."
              sudo dnf install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ec2-user
            fi
            # Ensure buildx plugin exists
            if ! docker buildx version &>/dev/null; then
              echo "Installing Docker Buildx plugin..."
              BUILDX_VER=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/buildx/releases/download/${BUILDX_VER}/buildx-${BUILDX_VER}.linux-amd64" -o /usr/local/lib/docker/cli-plugins/docker-buildx
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
            fi
            # Ensure compose plugin exists
            if ! docker compose version &>/dev/null; then
              echo "Installing Docker Compose plugin..."
              COMPOSE_VER=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # --- Clone or pull code ---
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First-time setup: cloning repository..."
              sudo mkdir -p /opt/mediride
              sudo chown ec2-user:ec2-user /opt/mediride
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git $APP_DIR
            else
              echo "Pulling latest changes..."
              cd $APP_DIR
              git fetch origin main
              git reset --hard origin/main
            fi

            cd $APP_DIR

            # --- Verify .env exists ---
            if [ ! -f ".env" ]; then
              echo "ERROR: .env file missing at $APP_DIR/.env"
              echo "SSH into the server and create it first:"
              echo "  cp deploy/env.staging.example .env"
              echo "  nano .env  # fill in real values"
              exit 1
            fi

            # --- Build and deploy ---
            echo "Building services..."
            $DC build

            echo "Starting services..."
            $DC up -d

            # --- Wait for infrastructure ---
            echo "Waiting for infrastructure to be healthy..."
            sleep 25

            # --- Run migrations ---
            echo "Running migrations..."
            $DC exec -T auth-service alembic upgrade head || echo "auth-service migration skipped"
            $DC exec -T user-service alembic upgrade head || echo "user-service migration skipped"
            $DC exec -T ride-service alembic upgrade head || echo "ride-service migration skipped"
            $DC exec -T location-service alembic upgrade head || echo "location-service migration skipped"
            $DC exec -T payment-service alembic upgrade head || echo "payment-service migration skipped"
            $DC exec -T tracking-service alembic upgrade head || echo "tracking-service migration skipped"
            $DC exec -T notification-service alembic upgrade head || echo "notification-service migration skipped"

            # --- Health check ---
            echo "Running health checks..."
            sleep 5
            HEALTH=$(curl -sf http://localhost:8080/health/live || echo "FAILED")
            echo "API Gateway health: $HEALTH"

            # --- Cleanup ---
            echo "Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "=== Deployment complete! ==="
            echo "Staging URL: https://staging.getmedigo.com"
