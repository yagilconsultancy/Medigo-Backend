name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to staging.getmedigo.com
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR=/opt/mediride
            COMPOSE_FILE=deploy/docker-compose.staging.yml

            echo "=== Deploying MediRide to staging ==="

            # Ensure git and docker are installed
            if ! command -v git &>/dev/null; then
              echo "Installing git..."
              sudo dnf install -y git
            fi
            if ! command -v docker &>/dev/null; then
              echo "Installing docker..."
              sudo dnf install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ec2-user
              # Install Docker Compose plugin
              COMPOSE_VER=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-linux-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              echo "Docker installed. You may need to re-run this workflow once for group permissions to take effect."
            fi

            # First-time setup: create dir and clone if it doesn't exist
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First-time setup: cloning repository..."
              sudo mkdir -p /opt/mediride
              sudo chown ec2-user:ec2-user /opt/mediride
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git $APP_DIR
            else
              echo "Pulling latest changes..."
              cd $APP_DIR
              git fetch origin main
              git reset --hard origin/main
            fi

            cd $APP_DIR

            # Verify .env exists
            if [ ! -f ".env" ]; then
              echo "ERROR: .env file missing at $APP_DIR/.env"
              echo "SSH into the server and create it first:"
              echo "  cp deploy/env.staging.example .env"
              echo "  nano .env  # fill in real values"
              exit 1
            fi

            # --- Build and deploy ---
            echo "Building services..."
            docker compose -f $COMPOSE_FILE build --parallel

            echo "Starting services..."
            docker compose -f $COMPOSE_FILE up -d

            # --- Wait for infrastructure ---
            echo "Waiting for infrastructure to be healthy..."
            sleep 20

            # --- Run migrations ---
            echo "Running migrations..."
            docker compose -f $COMPOSE_FILE exec -T auth-service alembic upgrade head || echo "auth-service migration skipped"
            docker compose -f $COMPOSE_FILE exec -T user-service alembic upgrade head || echo "user-service migration skipped"
            docker compose -f $COMPOSE_FILE exec -T ride-service alembic upgrade head || echo "ride-service migration skipped"
            docker compose -f $COMPOSE_FILE exec -T location-service alembic upgrade head || echo "location-service migration skipped"
            docker compose -f $COMPOSE_FILE exec -T payment-service alembic upgrade head || echo "payment-service migration skipped"
            docker compose -f $COMPOSE_FILE exec -T tracking-service alembic upgrade head || echo "tracking-service migration skipped"
            docker compose -f $COMPOSE_FILE exec -T notification-service alembic upgrade head || echo "notification-service migration skipped"

            # --- Health check ---
            echo "Running health checks..."
            sleep 5
            HEALTH=$(curl -sf http://localhost:8080/health/live || echo "FAILED")
            echo "API Gateway health: $HEALTH"

            # --- Cleanup ---
            echo "Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "=== Deployment complete! ==="
            echo "Staging URL: https://staging.getmedigo.com"
