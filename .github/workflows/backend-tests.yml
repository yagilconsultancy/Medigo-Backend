name: Backend tests

# Runs the unit tests of every backend service on each pull request.
# It only reads the code: it never deploys and uses no secrets.
on:
  pull_request:
    branches: [main, pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            path: tests
            deselect: ""
          - service: auth-service
            path: tests/unit
            # Known failure that already exists on main. Remove once fixed.
            deselect: "--deselect tests/unit/test_auth_service_otp_events.py::test_login_unverified_user_returns_otp_flag"
          - service: notification-service
            path: tests/unit
            # Known failure that already exists on main. Remove once fixed.
            deselect: "--deselect tests/unit/test_consumer_setup.py::test_setup_consumers_binds_admin_invite_events"
          - service: payment-service
            path: tests
            # Known failure that already exists on main. Remove once fixed.
            deselect: "--deselect tests/test_mobile_payment_service.py::test_create_payment_intent_creates_pending_transaction"
          - service: ride-service
            path: tests
            # Known failure that already exists on main. Remove once fixed.
            deselect: "--deselect tests/unit/test_rider_history_overview.py::test_get_rider_history_overview_builds_summary_stats_and_pagination"
          - service: user-service
            path: tests/unit
            deselect: ""

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install libs/common
          python - "${{ matrix.service }}" > /tmp/requirements.txt <<'PY'
          import sys, tomllib
          with open(f"services/{sys.argv[1]}/pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          for dep in data["project"]["dependencies"]:
              if not dep.startswith("mediride-common"):
                  print(dep)
          PY
          pip install -r /tmp/requirements.txt pytest pytest-asyncio aiosqlite

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: .
        run: python -m pytest ${{ matrix.path }} -q ${{ matrix.deselect }}
