version: "3.9"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - mediride-network

x-service-env: &service-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RABBITMQ_URL: amqp://mediride:${RABBITMQ_PASSWORD:-dev_password}@rabbitmq:5672/mediride
  REDIS_URL: redis://redis:6379/0

services:
  # ==================== INFRASTRUCTURE ====================

  postgres-auth:
    image: postgres:16-alpine
    <<: *service-defaults
    environment:
      POSTGRES_DB: mediride_auth
      POSTGRES_USER: mediride
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-dev_password}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediride -d mediride_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:16-alpine
    <<: *service-defaults
    environment:
      POSTGRES_DB: mediride_users
      POSTGRES_USER: mediride
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD:-dev_password}
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediride -d mediride_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-rides:
    image: postgres:16-alpine
    <<: *service-defaults
    environment:
      POSTGRES_DB: mediride_rides
      POSTGRES_USER: mediride
      POSTGRES_PASSWORD: ${POSTGRES_RIDES_PASSWORD:-dev_password}
    volumes:
      - postgres-rides-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediride -d mediride_rides"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-locations:
    image: postgis/postgis:16-3.4-alpine
    <<: *service-defaults
    environment:
      POSTGRES_DB: mediride_locations
      POSTGRES_USER: mediride
      POSTGRES_PASSWORD: ${POSTGRES_LOCATIONS_PASSWORD:-dev_password}
    volumes:
      - postgres-locations-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediride -d mediride_locations"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payments:
    image: postgres:16-alpine
    <<: *service-defaults
    environment:
      POSTGRES_DB: mediride_payments
      POSTGRES_USER: mediride
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENTS_PASSWORD:-dev_password}
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediride -d mediride_payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-tracking:
    image: postgis/postgis:16-3.4-alpine
    <<: *service-defaults
    environment:
      POSTGRES_DB: mediride_tracking
      POSTGRES_USER: mediride
      POSTGRES_PASSWORD: ${POSTGRES_TRACKING_PASSWORD:-dev_password}
    volumes:
      - postgres-tracking-data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediride -d mediride_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: *service-defaults
    environment:
      RABBITMQ_DEFAULT_USER: mediride
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev_password}
      RABBITMQ_DEFAULT_VHOST: mediride
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== APPLICATION SERVICES ====================

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8000"
    environment:
      <<: *service-env
      AUTH_SERVICE_URL: http://auth-service:8001
      USER_SERVICE_URL: http://user-service:8002
      RIDE_SERVICE_URL: http://ride-service:8003
      LOCATION_SERVICE_URL: http://location-service:8004
      PAYMENT_SERVICE_URL: http://payment-service:8005
      TRACKING_SERVICE_URL: http://tracking-service:8006
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://mediride:${POSTGRES_AUTH_PASSWORD:-dev_password}@postgres-auth:5432/mediride_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-5}
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://mediride:${POSTGRES_USERS_PASSWORD:-dev_password}@postgres-users:5432/mediride_users
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *service-env
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@mediride.com}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-auth-data:
  postgres-users-data:
  postgres-rides-data:
  postgres-locations-data:
  postgres-payments-data:
  postgres-tracking-data:
  rabbitmq-data:
  redis-data:

networks:
  mediride-network:
    driver: bridge
