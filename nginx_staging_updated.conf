upstream mediride_api {
    server 127.0.0.1:8080;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    server_name staging.getmedigo.com;
    client_max_body_size 20M;

    # REST API endpoints
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://mediride_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO through API Gateway (RECOMMENDED)
    location /api/v1/ws/socket.io/ {
        proxy_pass http://mediride_api/api/v1/ws/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important for Socket.IO
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }

    # Documentation endpoints
    location /docs {
        proxy_pass http://mediride_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://mediride_api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://mediride_api/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://mediride_api/health/live;
        proxy_set_header Host $host;
    }

    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/staging.getmedigo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.getmedigo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = staging.getmedigo.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name staging.getmedigo.com;
    return 404;
}
