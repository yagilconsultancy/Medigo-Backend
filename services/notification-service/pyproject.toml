[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediride-notification-service"
version = "0.1.0"
description = "MediRide Notification Service"
requires-python = ">=3.12"
dependencies = [
    "mediride-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aio-pika>=9.4.0",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
]
