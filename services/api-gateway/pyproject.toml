[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediride-api-gateway"
version = "0.1.0"
description = "MediRide API Gateway"
requires-python = ">=3.12"
dependencies = [
    "mediride-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
]
